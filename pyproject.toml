[project]
name = "mva-hackathon-2026"
version = "0.1.0"
description = "Track 1 variant prioritisation and Track 2 repurposing for the MVA Hackathon 2026"
requires-python = ">=3.11,<3.13"
license = { text = "CC-BY-4.0" }

# Pinned exactly. Regenerate the lock with:
#   uv lock && uv sync
dependencies = [
    "pydantic==2.9.2",          # evidence schemas with resolvable source fields
    "pyyaml==6.0.2",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "pysam==0.22.1",            # VCF and BAM access from Python
    "requests==2.32.3",
    "tenacity==9.0.0",          # retry policy for external APIs
    "rich==13.9.4",
]

[project.optional-dependencies]
# Track 1 splicing arm. Torch is pinned without a CUDA suffix here; on the GPU
# host install the matching cu12x wheel first, then sync.
splicing = [
    "pangolin-splice==1.0.2",
    "torch==2.5.1",
]
# Track 2. Kept separate so Track 1 can be reproduced without pulling
# cheminformatics dependencies.
track2 = [
    "rdkit==2024.3.6",
    "cmapPy==4.0.1",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "positive_control: spike-in recall tests from benchmarks/ (plan section 5.2)",
    "requires_data: needs data/, skipped when absent",
    "requires_alignment: needs a BAM, skipped until one is built",
    "slow: excluded from the default run",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mva"]
